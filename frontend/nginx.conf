# Sentinel — production: SPA + backend reverse-proxy (bitta origin)
server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    server_tokens off;

    # yuklama hajmi (CSV import va h.k.)
    client_max_body_size 12m;

    gzip            on;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Xavfsizlik header'lari SPA (HTML/asset) javoblariga location'larda
    # qo'yiladi. /api/ ga qo'yilmaydi — u yerda backend o'zi beradi.

    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        # $http_host -> portni ham saqlaydi ($host striplaydi); share havola
        # URL'i request.base_url'dan quriladi.
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $http_host;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass       http://backend:8000/health;
        proxy_set_header Host $host;
        access_log       off;
    }

    # --- statik assetlar (hashli fayl nomlari) — uzoq kesh ---
    location /assets/ {
        expires    1y;
        add_header  Cache-Control "public, immutable" always;
        add_header  X-Content-Type-Options "nosniff" always;
        try_files   $uri =404;
    }

    # --- SPA fallback ---
    location / {
        try_files $uri $uri/ /index.html;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    }

    # index.html hech qachon keshlanmasin (yangi deploy darhol ko'rinsin)
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    }
}
