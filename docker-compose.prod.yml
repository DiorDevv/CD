# ============================================================
#  Sentinel — PRODUCTION
#  Bitta port (:8090) ortida: nginx SPA'ni beradi + /api ni backendga uzatadi.
#  backend va db host'ga ochilmaydi.
#
#  Ishga tushirish (internet bor server — .env.prod SHART EMAS):
#    docker compose -f docker-compose.prod.yml up -d --build
#  Internetsiz VM (Squid): proksini build'ga uzating —
#    ./deploy/vm-setup.sh --proxy http://PROXY:3128
#  yoki HTTP_PROXY=... HTTPS_PROXY=... NO_PROXY=...,db,backend,web docker compose ... up -d --build
#  Kuchli parollarni o'zingiz belgilamoqchi bo'lsangiz:
#    cp .env.prod.example .env.prod  # to'ldiring
#    docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
#  .env.prod berilmasa: JWT_SECRET_KEY va super admin paroli konteyner ichida
#  bir marta generatsiya qilinib, `sdp_secrets` volume'da saqlanadi (parol
#  backend loglarida chop etiladi). DB host'ga ochilmaydi.
#
#  Ochish:  http://<host>:8090
# ============================================================
name: sd-prod

services:
  db:
    image: postgres:16-alpine
    container_name: sdp_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-soc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel}
      POSTGRES_DB: ${POSTGRES_DB:-soc_platform}
    volumes:
      - sdp_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-soc}"]
      interval: 5s
      timeout: 5s
      retries: 15

  backend:
    build:
      context: ./backend
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    image: sd-prod-backend
    container_name: sdp_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env.prod
        required: false
    environment:
      ENV: prod
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-soc}:${POSTGRES_PASSWORD:-sentinel}@db:5432/${POSTGRES_DB:-soc_platform}
      EXPORT_DIR: /app/exports
      SECRETS_DIR: /data
    # TLS reverse-proxy ortida to'g'ri sxema/IP ni ko'rish uchun
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      --proxy-headers --forwarded-allow-ips=*
    volumes:
      - sdp_exports:/app/exports
      - sdp_secrets:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: /api
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    image: sd-prod-web
    container_name: sdp_web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8090}:80"

volumes:
  sdp_db_data:
  sdp_exports:
  sdp_secrets:
